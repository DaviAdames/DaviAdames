name: Generate Arcade Contribution Graphs

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: arcade-contribution-graphs
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Arcade Contribution Graphs
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,breakout,galaga,puzzle-bobble,bomberman,minesweeper'
          player_style: 'opportunistic'

      - name: Apply custom palettes and validate output
        shell: python
        run: |
          from pathlib import Path

          LIGHT_CONTRIBUTION_COLORS = {
              "#ebedf0": "#E8EEF6",
              "#9be9a8": "#B8D8F5",
              "#40c463": "#6EADE7",
              "#30a14e": "#3D91D1",
              "#216e39": "#0F5FAF",
          }

          DARK_CONTRIBUTION_COLORS = {
              "#161b22": "#0B1F3A",
              "#0e4429": "#164E8C",
              "#006d32": "#1D70B8",
              "#26a641": "#2589D8",
              "#39d353": "#55B6F6",
          }

          ARCADE_COLORS = {
              "#ff0000": "#FF4B55",
              "#ff00ff": "#FF6FAE",
              "#ffff00": "#FFD84D",
              "#00ff00": "#55D68A",
              "#00ffff": "#35D8FF",
              "#0000ff": "#5577FF",
          }

          def apply_replacements(svg_path: Path, replacements: dict[str, str]) -> None:
              content = svg_path.read_text(encoding="utf-8")

              for original, replacement in replacements.items():
                  content = content.replace(original, replacement)
                  content = content.replace(original.upper(), replacement)

              svg_path.write_text(content, encoding="utf-8")
              print(f"Customized: {svg_path}")

          def fix_galaga_light(svg_path: Path) -> None:
              content = svg_path.read_text(encoding="utf-8")

              # The upstream Galaga renderer uses a black canvas and white
              # stars. That is fine for dark mode but wrong for light mode.
              content = content.replace(
                  '<rect width="100%" height="100%" fill="#000000"/>',
                  '<rect width="100%" height="100%" fill="#FFFFFF"/>',
                  1,
              )

              # Darken the starfield and labels so they remain visible.
              content = content.replace(
                  'fill="white" opacity=',
                  'fill="#475569" opacity=',
              )
              content = content.replace(
                  'fill="#aaaaaa">',
                  'fill="#475569">',
              )

              # Give the player ship a darker treatment only in light mode.
              if 'id="galagaLightShip"' not in content:
                  marker = '<svg width="'
                  filter = (
                      '<defs>'
                      '<filter id="galagaLightShip" x="-50%" y="-50%" width="200%" height="200%">'
                      '<feColorMatrix type="saturate" values="0.25" />'
                      '<feComponentTransfer>'
                      '<feFuncR type="linear" slope="0.45" />'
                      '<feFuncG type="linear" slope="0.45" />'
                      '<feFuncB type="linear" slope="0.45" />'
                      '</feComponentTransfer>'
                      '</filter>'
                      '</defs>'
                  )
                  content = content.replace(marker, marker + filter, 1)

              content = content.replace(
                  '<image x="-16" y="-35" width="32" height="35" href="',
                  '<image filter="url(#galagaLightShip)" x="-16" y="-35" width="32" height="35" href="',
                  1,
              )

              svg_path.write_text(content, encoding="utf-8")
              print(f"Applied Galaga light-mode treatment: {svg_path}")

          games = [
              "pacman",
              "breakout",
              "galaga",
              "puzzle-bobble",
              "bomberman",
              "minesweeper",
          ]

          dist = Path("dist")

          expected_files = []

          for game in games:
              light = dist / f"{game}-contribution-graph.svg"
              dark = dist / f"{game}-contribution-graph-dark.svg"

              if light.exists():
                  apply_replacements(
                      light,
                      {**LIGHT_CONTRIBUTION_COLORS, **ARCADE_COLORS},
                  )

              if dark.exists():
                  apply_replacements(
                      dark,
                      {**DARK_CONTRIBUTION_COLORS, **ARCADE_COLORS},
                  )

              if game == "galaga" and light.exists():
                  fix_galaga_light(light)

              expected_files.extend([light, dark])

          missing = [
              str(path)
              for path in expected_files
              if not path.is_file() or path.stat().st_size == 0
          ]

          if missing:
              raise SystemExit(
                  "Missing or empty generated SVGs: " + ", ".join(missing)
              )

          # Smart wrappers are intentionally forbidden: theme selection is
          # handled by <picture> in README.md, not by nested SVGs.
          smart_files = list(dist.glob("*-contribution-graph-smart.svg"))

          if smart_files:
              raise SystemExit(
                  "Unexpected smart SVG files found: "
                  + ", ".join(map(str, smart_files))
              )

          print(f"Validated {len(expected_files)} arcade SVG files.")

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          allow_empty_commit: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}