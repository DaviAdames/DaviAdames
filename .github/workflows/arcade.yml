name: Generate Arcade Contribution Graphs

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Arcade Contribution Graphs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: DaviAdames
          games: 'pacman,breakout,galaga,puzzle-bobble,bomberman,minesweeper'
          player_style: 'opportunistic'

      - name: Apply custom palettes and build theme-aware links
        shell: python
        run: |
          from pathlib import Path

          LIGHT_CONTRIBUTION_COLORS = {
              "#ebedf0": "#E8EEF6",
              "#9be9a8": "#B8D8F5",
              "#40c463": "#6EADE7",
              "#30a14e": "#3D91D1",
              "#216e39": "#0F5FAF",
          }

          DARK_CONTRIBUTION_COLORS = {
              "#161b22": "#0B1F3A",
              "#0e4429": "#164E8C",
              "#006d32": "#1D70B8",
              "#26a641": "#2589D8",
              "#39d353": "#55B6F6",
          }

          ARCADE_COLORS = {
              "#ff0000": "#FF4B55",
              "#ff00ff": "#FF6FAE",
              "#ffff00": "#FFD84D",
              "#00ff00": "#55D68A",
              "#00ffff": "#35D8FF",
              "#0000ff": "#5577FF",
          }

          def apply_replacements(svg_path: Path, replacements: dict[str, str]) -> None:
              content = svg_path.read_text(encoding="utf-8")
              for original, replacement in replacements.items():
                  content = content.replace(original, replacement)
                  content = content.replace(original.upper(), replacement)
              svg_path.write_text(content, encoding="utf-8")
              print(f"Customized: {svg_path}")

          games = [
              "pacman",
              "breakout",
              "galaga",
              "puzzle-bobble",
              "bomberman",
              "minesweeper",
          ]

          dist = Path("dist")

          for game in games:
              light = dist / f"{game}-contribution-graph.svg"
              dark = dist / f"{game}-contribution-graph-dark.svg"

              if light.exists():
                  apply_replacements(
                      light,
                      {**LIGHT_CONTRIBUTION_COLORS, **ARCADE_COLORS},
                  )

              if dark.exists():
                  apply_replacements(
                      dark,
                      {**DARK_CONTRIBUTION_COLORS, **ARCADE_COLORS},
                  )

              # One direct URL per game. The wrapper SVG switches between the
              # generated light/dark results using prefers-color-scheme.
              smart = dist / f"{game}-contribution-graph-smart.svg"

              smart.write_text(
                  f'''<svg xmlns="http://www.w3.org/2000/svg" width="1166" height="174" viewBox="0 0 1166 174">
          <style>
            .light {{ display: inline; }}
            .dark {{ display: none; }}
            @media (prefers-color-scheme: dark) {{
              .light {{ display: none; }}
              .dark {{ display: inline; }}
            }}
          </style>
          <image class="light" href="https://raw.githubusercontent.com/DaviAdames/DaviAdames/output/{game}-contribution-graph.svg" x="0" y="0" width="1166" height="174" preserveAspectRatio="xMidYMid meet" />
          <image class="dark" href="https://raw.githubusercontent.com/DaviAdames/DaviAdames/output/{game}-contribution-graph-dark.svg" x="0" y="0" width="1166" height="174" preserveAspectRatio="xMidYMid meet" />
          </svg>\n''',
                  encoding="utf-8",
              )

              print(f"Created theme-aware SVG: {smart}")

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}