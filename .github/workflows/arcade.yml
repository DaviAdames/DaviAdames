name: Generate Arcade Contribution Graphs

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: arcade-contribution-graphs
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # Each arcade game is generated in its own Node process below.
      # This prevents one renderer from accumulating the memory of all games.
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: DaviAdames
          games: 'pacman'
          player_style: 'opportunistic'

      - name: Generate Breakout
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: DaviAdames
          games: 'breakout'
          player_style: 'opportunistic'

      - name: Generate Galaga
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: DaviAdames
          games: 'galaga'
          player_style: 'opportunistic'

      - name: Generate Bomberman
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: DaviAdames
          games: 'bomberman'
          player_style: 'opportunistic'

      - name: Generate Minesweeper
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: DaviAdames
          games: 'minesweeper'
          player_style: 'opportunistic'

      - name: Apply custom palettes, fix Galaga light mode, and validate output
        shell: python
        run: |
          from pathlib import Path
          import re

          LIGHT_CONTRIBUTION_COLORS = {
              "#ebedf0": "#E8EEF6",
              "#9be9a8": "#B8D8F5",
              "#40c463": "#6EADE7",
              "#30a14e": "#3D91D1",
              "#216e39": "#0F5FAF",
          }

          DARK_CONTRIBUTION_COLORS = {
              "#161b22": "#0B1F3A",
              "#0e4429": "#164E8C",
              "#006d32": "#1D70B8",
              "#26a641": "#2589D8",
              "#39d353": "#55B6F6",
          }

          ARCADE_COLORS = {
              "#ff0000": "#FF4B55",
              "#ff00ff": "#FF6FAE",
              "#ffff00": "#FFD84D",
              "#00ff00": "#55D68A",
              "#00ffff": "#35D8FF",
              "#0000ff": "#5577FF",
          }

          GAMES = [
              "pacman",
              "breakout",
              "galaga",
              "bomberman",
              "minesweeper",
          ]

          DIST = Path("dist")

          def replace_colors(svg_path: Path, replacements: dict[str, str]) -> None:
              content = svg_path.read_text(encoding="utf-8")

              for original, replacement in replacements.items():
                  content = content.replace(original, replacement)
                  content = content.replace(original.upper(), replacement)

              svg_path.write_text(content, encoding="utf-8")
              print(f"Customized: {svg_path}")

          def fix_galaga_light(svg_path: Path) -> None:
              content = svg_path.read_text(encoding="utf-8")

              # Upstream Galaga uses a dark space canvas in both themes.
              # Replace only the full-canvas background rectangle.
              content, background_count = re.subn(
                  r'(<rect\b[^>]*\bwidth=["\']100%["\'][^>]*\bheight=["\']100%["\'][^>]*\bfill=["\'])#(?:000000|000000)["\']',
                  r'\1#FFFFFF"',
                  content,
                  count=1,
              )

              # Some builds place the attributes in a different order.
              if background_count == 0:
                  content, _ = re.subn(
                      r'(<rect\b[^>]*\bfill=["\'])#000000(["\'][^>]*\bwidth=["\']100%["\'][^>]*\bheight=["\'][^>]*\/?>)',
                      r'\1#FFFFFF\2',
                      content,
                      count=1,
                  )

              # White stars become muted/dark against the light canvas.
              content = re.sub(
                  r'(<(?:circle|rect)\b[^>]*\bfill=["\'])(?:white|#ffffff)(["\'])',
                  r'\1#475569\2',
                  content,
              )

              # Preserve readability for light-mode text labels.
              content = re.sub(
                  r'(<text\b[^>]*\bfill=["\'])(?:white|#ffffff)(["\'])',
                  r'\1#334155\2',
                  content,
              )

              svg_path.write_text(content, encoding="utf-8")
              print(f"Applied Galaga light-mode treatment: {svg_path}")

          expected = []

          for game in GAMES:
              light = DIST / f"{game}-contribution-graph.svg"
              dark = DIST / f"{game}-contribution-graph-dark.svg"

              if not light.is_file() or light.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty: {light}")

              if not dark.is_file() or dark.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty: {dark}")

              replace_colors(
                  light,
                  {**LIGHT_CONTRIBUTION_COLORS, **ARCADE_COLORS},
              )

              replace_colors(
                  dark,
                  {**DARK_CONTRIBUTION_COLORS, **ARCADE_COLORS},
              )

              if game == "galaga":
                  fix_galaga_light(light)

              expected.extend([light, dark])

          smart_files = list(DIST.glob("*-contribution-graph-smart.svg"))
          if smart_files:
              raise SystemExit(
                  "Unexpected smart SVG files found: "
                  + ", ".join(map(str, smart_files))
              )

          print(f"Validated {len(expected)} arcade SVG files.")

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          allow_empty_commit: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}