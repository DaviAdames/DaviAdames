name: generate Pac-Man contribution graph

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: DaviAdames
          games: 'pacman'
          player_style: 'opportunistic'

      - name: Apply custom theme palettes
        shell: python
        run: |
          from pathlib import Path

          # ==========================================================
          # Custom contribution palettes
          #
          # IMPORTANT:
          # Light and dark SVGs are customized independently so the
          # light version remains light and the dark version remains
          # dark.
          # ==========================================================

          light_contribution_colors = {
              "#ebedf0": "#E8EEF6",
              "#9be9a8": "#B8D8F5",
              "#40c463": "#6EADE7",
              "#30a14e": "#3D91D1",
              "#216e39": "#0F5FAF",
          }

          dark_contribution_colors = {
              "#161b22": "#0B1F3A",
              "#0e4429": "#164E8C",
              "#006d32": "#1D70B8",
              "#26a641": "#2589D8",
              "#39d353": "#55B6F6",
          }

          # ==========================================================
          # Pac-Man arcade palette
          # Applied to both themes.
          # ==========================================================

          pacman_colors = {
              "#ff0000": "#FF4B55",
              "#ff00ff": "#FF6FAE",
              "#ffff00": "#FFD84D",
              "#00ff00": "#55D68A",
              "#00ffff": "#35D8FF",
              "#0000ff": "#5577FF",
          }

          def apply_replacements(svg_path, replacements):
              content = svg_path.read_text(encoding="utf-8")

              for original, replacement in replacements.items():
                  content = content.replace(
                      original,
                      replacement
                  )
                  content = content.replace(
                      original.upper(),
                      replacement
                  )

              svg_path.write_text(
                  content,
                  encoding="utf-8"
              )

              print(f"Customized: {svg_path}")

          # ==========================================================
          # Light theme
          # ==========================================================

          light_replacements = {
              **light_contribution_colors,
              **pacman_colors,
          }

          for svg_path in Path("dist").glob(
              "pacman-contribution-graph.svg"
          ):
              apply_replacements(
                  svg_path,
                  light_replacements
              )

          # ==========================================================
          # Dark theme
          # ==========================================================

          dark_replacements = {
              **dark_contribution_colors,
              **pacman_colors,
          }

          for svg_path in Path("dist").glob(
              "pacman-contribution-graph-dark.svg"
          ):
              apply_replacements(
                  svg_path,
                  dark_replacements
              )

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
