name: generate pacman contribution graph

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: DaviAdames
          games: 'pacman'
          player_style: 'opportunistic'

      - name: Apply custom blue and pink palette
        shell: python
        run: |
          from pathlib import Path

          # ==========================================================
          # Contribution colors
          # Navy blue -> light blue according to contribution level
          # ==========================================================

          contribution_colors = {
              # GitHub light theme
              "#ebedf0": "#0B1F3A",
              "#9be9a8": "#164E8C",
              "#40c463": "#1D70B8",
              "#30a14e": "#2589D8",
              "#216e39": "#55B6F6",

              # GitHub dark theme
              "#161b22": "#0B1F3A",
              "#0e4429": "#164E8C",
              "#006d32": "#1D70B8",
              "#26a641": "#2589D8",
              "#39d353": "#55B6F6",
          }

          # ==========================================================
          # Pac-Man colors
          # Yellow Pac-Man + classic ghost palette
          # ==========================================================

          pacman_colors = {
              # Pac-Man
              "#ffff00": "#FFD84D",

              # Ghosts / arcade elements
              "#ff0000": "#FF4B55",
              "#00ffff": "#35D8FF",
              "#ff69b4": "#FF6FAE",
              "#ff8000": "#FF9D3D",
              "#0000ff": "#5577FF",
          }

          replacements = {
              **contribution_colors,
              **pacman_colors,
          }

          for svg_path in Path("dist").glob("pacman-contribution-graph*.svg"):
              content = svg_path.read_text(encoding="utf-8")

              for original, replacement in replacements.items():
                  content = content.replace(
                      original,
                      replacement
                  )
                  content = content.replace(
                      original.upper(),
                      replacement
                  )

              svg_path.write_text(
                  content,
                  encoding="utf-8"
              )

              print(f"Customized: {svg_path}")

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
