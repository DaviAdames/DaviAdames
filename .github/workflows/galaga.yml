name: generate arcade contribution graphs

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Galaga contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: DaviStarlight
          games: 'galaga'

      - name: Apply custom blue and pink palette
        shell: python
        run: |
          from pathlib import Path

          # ==========================================================
          # Contribution colors
          # Dark blue -> light blue according to contribution level
          # ==========================================================

          contribution_colors = {
              # GitHub light theme
              "#ebedf0": "#0B1F3A",
              "#9be9a8": "#164E8C",
              "#40c463": "#1D70B8",
              "#30a14e": "#2589D8",
              "#216e39": "#55B6F6",

              # GitHub dark theme
              "#161b22": "#0B1F3A",
              "#0e4429": "#164E8C",
              "#006d32": "#1D70B8",
              "#26a641": "#2589D8",
              "#39d353": "#55B6F6",
          }

          # ==========================================================
          # Galaga colors
          # Pink/magenta palette for the ship and projectiles
          # ==========================================================

          galaga_colors = {
              "#ff0000": "#FF4FA3",
              "#ff00ff": "#E83E8C",
              "#ffff00": "#FF77B7",
              "#00ff00": "#FF5C9A",
              "#00ffff": "#FF8AC4",
              "#0000ff": "#C72C78",
          }

          replacements = {
              **contribution_colors,
              **galaga_colors,
          }

          for svg_path in Path("dist").glob("galaga-contribution-graph*.svg"):
              content = svg_path.read_text(encoding="utf-8")

              for original, replacement in replacements.items():
                  content = content.replace(
                      original,
                      replacement
                  )
                  content = content.replace(
                      original.upper(),
                      replacement
                  )

              svg_path.write_text(
                  content,
                  encoding="utf-8"
              )

              print(f"Customized: {svg_path}")

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
